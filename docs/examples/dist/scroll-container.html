<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>scroll-container</title>
        <meta name="description" content="Converts HTML input/textarea into Tags component">
        <meta name="author" content="Yair Even-Or">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="keywords" content="tag, tags, tagging, tagify, javascript, component, web">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📌</text></svg>">

        <!-- Tagify source code & styles -->
        <script src="../../../dist/tagify.js"></script>
        <link href="../../../dist/tagify.css" rel="stylesheet">

        <!-- 3rd-party files for d&d support -->
        <script src="../../../../dragsort/dist/dragsort.js"></script>
        <link href="../../../../dragsort/dist/dragsort.css" rel="stylesheet" media="print" onload="this.media='all'">

        <style>
          html, body{ min-height:100%; scroll-behavior: smooth; }
          body{
            font: 14px Arial;
            margin: 0;
            overflow-x: hidden;
            height: 100vh;
            display: grid;
            place-items: center;
          }

          .tagify {
            min-width: 300px;
            max-width: 500px;
          }

          .tagify + input, .tagify + textarea {
            position: fixed !important;
            bottom: 10px;
            left: 10px !important;
            right: 10px;
            transform: none !important;
            padding: 6px;
            border: 2px solid #999;
            margin-bottom: 1em;
            border-radius: 5px;
            background: #F1F1F1;
          }
        </style>

        <script>
            // if IE, add IE tagify's polyfills
            !function( d ) {
                if( !d.currentScript ){
                    var s = d.createElement( 'script' );
                    s.src = 'dist/tagify.polyfills.min.js';
                    d.head.appendChild( s );
                }
            }(document)
        </script>
    </head>

    <body>
        <style>
        .demo-group {
    width: 380px;
    margin-bottom: 2em;
}

.demo-group label {
    display: block;
    margin-bottom: .4em;
    font-size: .85em;
    color: #666;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: .04em;
}

.demo-group .tagify {
    width: 100%;
}

        </style>
        <div>
        <div class="demo-group">
    <label>Scroll + custom arrow buttons + icon</label>
    <input class='sc-custom-btns' placeholder="Type something...">
</div>

        </div>
        <script>
        // Scroll + custom SVG arrow buttons + fixed icon
new Tagify(document.querySelector('input.sc-custom-btns'), {
    scrollContainer: {
        enabled: true,
        buttons: {
            back:    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
            forward: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
        },
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
    }
})

        </script>
    </body>
</html>
